spring.application.name=naildp
#spring.profiles.include=testdb
#spring.profiles.active=secret
server.port=8080

spring.servlet.multipart.maxFileSize=50MB
spring.servlet.multipart.maxRequestSize=50MB

spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.default_batch_fetch_size=100
spring.jpa.database=mysql
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

#RDB
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#redis
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT}
spring.data.redis.password=${REDIS_PASSWORD}

#kafka
spring.kafka.bootstrap-servers=${KAFKA_SERVERS}:9092
spring.kafka.chat-consumer.group-id=chat-consumer-group

#mongoDB
spring.data.mongodb.uri=${MONGODB_URL}

#monitoring
management.endpoints.web.exposure.include=health, beans, info, metrics, prometheus
management.metrics.tags.application= spring-server

#s3
cloud.aws.credentials.accessKey=${AWS_ACCESS_KEY}
cloud.aws.credentials.secretKey=${AWS_SECRET_KEY}
cloud.aws.region.static=ap-northeast-2
cloud.aws.stack.auto=false
cloud.aws.s3.bucketName=${AWS_BUCKETNAME}

#kakao auth
spring.security.oauth2.client.registration.kakao.clientId=${KAKAO_CLIENT_ID}
spring.security.oauth2.client.registration.kakao.clientSecret=${KAKAO_CLIENT_SECRET}
spring.security.oauth2.client.registration.kakao.clientAuthenticationMethod=client_secret_post
spring.security.oauth2.client.registration.kakao.authorizationGrantType=authorization_code
spring.security.oauth2.client.registration.kakao.redirectUri=http://localhost:8080/api/login/oauth2/code/kakao
spring.security.oauth2.client.registration.kakao.scope=profile_image,account_email
spring.security.oauth2.client.registration.kakao.client-name=kakao
spring.security.oauth2.client.provider.kakao.authorizationUri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.tokenUri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.userInfoUri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.userNameAttribute=id
#google auth
spring.security.oauth2.client.registration.google.clientId=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.clientSecret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.redirectUri=http://localhost:8080/api/login/oauth2/code/google
spring.security.oauth2.client.registration.google.scope=email,profile
#Naver auth
spring.security.oauth2.client.registration.naver.clientId=${NAVER_CLIENT_ID}
spring.security.oauth2.client.registration.naver.clientSecret=${NAVER_CLIENT_SECRET}
spring.security.oauth2.client.registration.naver.authorizationGrantType=authorization_code
spring.security.oauth2.client.registration.naver.redirectUri=http://localhost:8080/api/login/oauth2/code/naver
spring.security.oauth2.client.registration.naver.scope=email,profile_image
spring.security.oauth2.client.registration.naver.clientName=Naver
spring.security.oauth2.client.provider.naver.authorizationUri=https://nid.naver.com/oauth2.0/authorize
spring.security.oauth2.client.provider.naver.tokenUri=https://nid.naver.com/oauth2.0/token
spring.security.oauth2.client.provider.naver.userInfoUri=https://openapi.naver.com/v1/nid/me
spring.security.oauth2.client.provider.naver.userNameAttribute=response

