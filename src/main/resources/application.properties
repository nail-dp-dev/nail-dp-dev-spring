jwt.secret.key=${JWT_SECRET:d42ad6111848f136a3de63282954ec1fb581f7cc9c8cc3a6e63fd34547ec7a29d2362ca9f9ba99af7bb7c56fa5af71fd862ad6c44591172357fe0b52448cfa29}

server.address=0.0.0.0
spring.server.domain=http://localhost:3000

#PORTONE
portone.auth.api=${PORTONE_AUTH}
portone.auth.api_secret=${PORTONE_SECRET}

#VAPID ???
vapid.public.key=${VAPID_PUBLIC_KEY}
vapid.private.key=${VAPID_PRIVATE_KEY}

#aes ???
aes.secret-key=${AES_SECRET}
aes.iv-key=${AES_IV_KEY}

#logging
logging.level.org.springframework.security=error
logging.level.org.springframework.data.elasticsearch.client.WIRE=TRACE
